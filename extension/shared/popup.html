<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klarkey</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand">Klarkey</div>
        <div id="siteHost" class="site-host"></div>
      </header>

      <section class="section">
        <p class="eyebrow">Browser bridge</p>
        <p id="title" class="message">Checking the desktop bridge for this browser.</p>
        <p id="statusMessage" class="detail"></p>
      </section>

      <section class="section">
        <p class="eyebrow">Passkeys</p>
        <p id="passkeyTitle" class="subhead">Checking passkey support.</p>
        <p id="passkeyMessage" class="detail"></p>
      </section>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
