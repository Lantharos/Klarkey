name: Build Desktop Release

on:
  workflow_dispatch:

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Sabine CLI
        run: cargo install --git https://github.com/Lantharos/Sabine.git --rev ed1695c489417ee81b2aa9339170ea1a4e8bc995 --locked sabine-cli

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows desktop release
        run: bun run build:desktop

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: klarkey-desktop-release
          path: release/**
