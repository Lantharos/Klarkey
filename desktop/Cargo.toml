[package]
name = "klarkey-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
aes-gcm = "0.10.3"
arboard = "3.6.1"
base64 = "0.22.1"
ciborium = "0.2.2"
fenestra-cef = { path = "../../fenestra/crates/fenestra-cef" }
hex = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2.186"
p256 = "0.13.2"
pbkdf2 = { version = "0.13.0", features = ["hmac", "sha2"] }
psl = "2.1.210"
rand = "0.9.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rfd = "0.17.2"
rsa = { version = "0.9.10", features = ["sha1", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10.6", default-features = false, features = ["oid"] }
sha2 = "0.11.0"
signature = "2"
ssh-agent-lib = "0.5.2"
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "rsa"] }
stuk-actions = { path = "../../stuk/crates/stuk-actions" }
sysinfo = "0.39.1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "io-util", "macros"] }
url = "2.5.8"
zeroize = "1.8.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", features = ["block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4.1.0"
